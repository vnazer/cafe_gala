<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gala Café Cochoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-screen POS. Sticky chalkboard header with four stations (Caja, Barra, Cierre, Menú); each station fills the rest of the screen. */
:root{
  --bg:#edf1f2; --surface:#ffffff; --surface-2:#e3e9eb; --line:#d0d9dc;
  --ink:#1c2326; --muted:#5a686d; --board:#20282b; --board-ink:#eef3f4;
  --accent:#23749d; --on-accent:#ffffff; --accent-soft:#d7eaf3; --accent-ink:#0f4560;
  --sun:#e2b52b; --sun-soft:#f8ecc3; --sun-ink:#5f4800;
  --clay:#c4502c; --clay-soft:#f6dfd6;
  --ok:#2b8553; --ok-soft:#d8efe1; --warn:#b97c08; --warn-soft:#f7e8c8; --crit:#c0392b; --crit-soft:#f6d9d5;
  --shadow:0 1px 2px rgba(20,30,35,.06),0 4px 14px rgba(20,30,35,.06);
  --f-display:"Caveat","Segoe Script","Bradley Hand",cursive;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171d20; --surface:#212a2e; --surface-2:#2a353a; --line:#36444a;
  --ink:#ecf2f3; --muted:#9badb3; --board:#11171a; --board-ink:#eef3f4;
  --accent:#8cc8e6; --on-accent:#0e2530; --accent-soft:#1f3b48; --accent-ink:#bfe3f4;
  --sun:#f0cf5a; --sun-soft:#3d3416; --sun-ink:#f6dc85;
  --clay:#e5774f; --clay-soft:#43271d;
  --ok:#5cc58a; --ok-soft:#1c3a2a; --warn:#eab140; --warn-soft:#3d3015; --crit:#f07466; --crit-soft:#46221f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#171d20; --surface:#212a2e; --surface-2:#2a353a; --line:#36444a;
  --ink:#ecf2f3; --muted:#9badb3; --board:#11171a; --board-ink:#eef3f4;
  --accent:#8cc8e6; --on-accent:#0e2530; --accent-soft:#1f3b48; --accent-ink:#bfe3f4;
  --sun:#f0cf5a; --sun-soft:#3d3416; --sun-ink:#f6dc85;
  --clay:#e5774f; --clay-soft:#43271d;
  --ok:#5cc58a; --ok-soft:#1c3a2a; --warn:#eab140; --warn-soft:#3d3015; --crit:#f07466; --crit-soft:#46221f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* ---------- header (the chalkboard) ---------- */
.top{background:var(--board);color:var(--board-ink);display:flex;align-items:center;gap:20px;padding-block:8px;padding-inline:16px;flex-wrap:wrap;position:relative;z-index:5}
.brand{display:flex;align-items:baseline;gap:8px;line-height:1}
.logo{font-family:var(--f-display);font-weight:700;font-size:32px;color:#a9d6ec;letter-spacing:.5px}
.sub{font-size:11px;font-weight:800;letter-spacing:.24em;color:#f0cf5a}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;border-radius:999px;color:#c3d0d4;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{background:rgba(255,255,255,.07);color:#fff}
.tab[aria-selected="true"]{background:#eef3f4;color:#152024}
.tab .count{min-width:20px;height:20px;border-radius:10px;background:#f0cf5a;color:#2a2200;font-size:12px;font-weight:800;display:inline-grid;place-items:center;padding:0 6px}
.tab .count:empty{display:none}
.status{display:flex;align-items:center;gap:12px;font-size:13px;color:#b7c5ca}
.sync{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#8a979b}
.sync.live i{background:#5cc58a;box-shadow:0 0 0 3px rgba(92,197,138,.25)}
.sync.local i{background:#f0cf5a}
#clock{font-weight:700;color:#eef3f4;font-size:15px}

main{flex:1;min-height:0;position:relative}
.view{height:100%;min-height:0}

/* ---------- shared bits ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--r-sm);font-weight:700;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);min-height:42px;transition:transform .06s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.danger{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.btn.ghost{background:transparent}
.btn.big{min-height:56px;font-size:17px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 8px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.label{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=search],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;min-height:42px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px 16px;gap:10px}
.empty h3{margin:0;color:var(--ink);font-size:18px}
.empty p{margin:0;max-width:44ch}

/* the pager puck: their black beeper with the white number sticker */
.puck{display:inline-grid;place-items:center;width:46px;height:58px;border-radius:10px;background:#151819;border:1px solid #3a4448;flex:none;box-shadow:inset 0 -6px 0 rgba(255,255,255,.04)}
.puck i{font-style:normal;width:30px;height:30px;border-radius:50%;background:#efeee9;color:#1a1a1a;display:grid;place-items:center;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.puck.sm{width:30px;height:38px;border-radius:7px}
.puck.sm i{width:21px;height:21px;font-size:11px}
.puck.none i{background:transparent;color:#8a979b;font-size:11px}
.puck.lg{width:64px;height:80px;border-radius:13px}
.puck.lg i{width:44px;height:44px;font-size:22px}

/* ================= CAJA ================= */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%}
.catalog{display:flex;flex-direction:column;min-height:0;min-width:0}
.catbar{display:flex;flex-direction:column;gap:10px;padding-block:14px 8px;padding-inline:16px}
.searchrow{display:flex;gap:10px;align-items:center}
.searchrow input{max-width:320px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.strip{display:flex;gap:8px;overflow-x:auto;padding-block:2px 6px;padding-inline:16px;align-items:center;min-height:0}
.strip:empty{display:none}
.strip .label{flex:none;margin-right:4px}
.oc{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;font-size:13px;font-weight:600}
.oc b{font-size:14px}
.pill{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.st-nuevo{background:var(--accent-soft);color:var(--accent-ink)}
.st-preparando{background:var(--sun-soft);color:var(--sun-ink)}
.st-listo{background:var(--ok-soft);color:var(--ok)}
.st-entregado{background:var(--surface-2);color:var(--muted)}
.st-anulado{background:var(--crit-soft);color:var(--crit)}
.grid{flex:1;min-height:0;overflow-y:auto;padding-block:8px 100px;padding-inline:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;align-content:start}
.gsec{grid-column:1/-1;margin-top:10px;display:flex;align-items:baseline;gap:10px}
.gsec h2{font-family:var(--f-display);font-size:28px;font-weight:700;margin:0;line-height:1}
.gsec span{color:var(--muted);font-size:13px}
.prod{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;align-items:stretch;gap:6px;min-height:118px;height:auto;box-shadow:var(--shadow);transition:transform .06s,border-color .15s}
.prod:hover{border-color:var(--accent)}
.prod:active{transform:scale(.97)}
.prod .ico{width:30px;height:30px;color:var(--accent)}
.prod .nm{font-weight:700;font-size:15.5px;line-height:1.2;text-wrap:balance}
.prod .pr{margin-top:auto;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:space-between;gap:6px}
.prod .opt{font-size:11px;color:var(--muted);font-weight:600}
.prod .badge{position:absolute;top:8px;right:8px;min-width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13px;display:grid;place-items:center;padding:0 7px}
.prod.flash{animation:flash .35s}
@keyframes flash{50%{background:var(--accent-soft)}}

.cart{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:8px}
.cart-head h2{margin:0;font-family:var(--f-display);font-size:30px;line-height:1}
.cart-head .x{display:none}
.lines{flex:1;min-height:60px;overflow-y:auto;padding:0 16px}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .nm{font-weight:700}
.line .md{font-size:12.5px;color:var(--muted)}
.line .md em{font-style:normal;color:var(--clay);font-weight:700}
.line .lt{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;background:var(--surface-2);border-radius:999px}
.step button{width:32px;height:32px;border-radius:50%;font-weight:800;font-size:18px;display:grid;place-items:center}
.step button:hover{background:var(--line)}
.step span{min-width:20px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.meta{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:52%}
.field{display:flex;flex-direction:column;gap:6px}
.pagers{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.pg{aspect-ratio:1;border-radius:50%;background:var(--surface-2);font-weight:800;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums;border:2px solid transparent}
.pg:hover:not(:disabled){border-color:var(--accent)}
.pg[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pg:disabled{background:transparent;color:var(--muted);opacity:.5;text-decoration:line-through;cursor:not-allowed;border:1px dashed var(--line)}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px}
.cash{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.cash .chg{font-weight:800;font-size:18px;padding-bottom:8px}
.cart-foot{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot b{font-size:28px;font-variant-numeric:tabular-nums}
.cart-fab{display:none}

/* sheet / modal */
.overlay{position:fixed;inset:0;background:rgba(10,16,18,.55);z-index:50;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:16px;width:min(560px,100%);max-height:calc(100% - 20px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
.sheet header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 6px}
.sheet h3{margin:0;font-size:22px;line-height:1.15}
.sheet .sp{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.sheet .body{padding:8px 20px 4px;display:flex;flex-direction:column;gap:14px}
.sheet .chips{display:flex;flex-wrap:wrap;gap:8px}
.sheet footer{display:flex;gap:12px;align-items:center;padding:14px 20px 18px;border-top:1px solid var(--line);margin-top:10px;position:sticky;bottom:0;background:var(--surface)}
.sheet footer .btn.primary{flex:1}
.sheet .step button{width:44px;height:44px}
.sheet .step span{min-width:30px;font-size:18px}
.xbtn{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:20px;flex:none}

/* ================= BARRA ================= */
.bar{display:flex;flex-direction:column;height:100%;min-height:0}
.barhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:12px;padding-inline:16px;border-bottom:1px solid var(--line);background:var(--surface)}
.barhead h2{margin:0;font-family:var(--f-display);font-size:30px;line-height:1}
.todo{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.todo .t{background:var(--surface-2);border-radius:8px;padding:5px 10px;font-weight:700;font-size:13.5px}
.todo .t em{font-style:normal;color:var(--clay)}
.barbody{flex:1;min-height:0;overflow-y:auto;padding-block:16px 40px;padding-inline:16px;display:flex;flex-direction:column;gap:18px}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;align-items:start}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.ticket.is-new{animation:pop .8s ease-out}
@keyframes pop{0%{box-shadow:0 0 0 0 var(--accent)}40%{box-shadow:0 0 0 8px var(--accent-soft)}100%{box-shadow:var(--shadow)}}
.ticket header{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.ticket .who{flex:1;min-width:0}
.ticket .who b{font-size:20px;font-variant-numeric:tabular-nums}
.ticket .who .nmx{font-weight:700;margin-left:6px;overflow:hidden;text-overflow:ellipsis}
.ticket .who small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.age{font-weight:800;font-size:14px;padding:5px 10px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.age.ok{background:var(--ok-soft);color:var(--ok)}
.age.warn{background:var(--warn-soft);color:var(--warn)}
.age.crit{background:var(--crit-soft);color:var(--crit)}
.tl{list-style:none;margin:0;padding:6px 8px}
.tl li{display:grid;grid-template-columns:28px auto minmax(0,1fr);gap:8px;align-items:start;padding:9px 6px;border-radius:8px;cursor:pointer;user-select:none}
.tl li:hover{background:var(--surface-2)}
.tl .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;margin-top:1px}
.tl li.done .box{background:var(--ok);border-color:var(--ok)}
.tl li.done .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tl li.done .nm,.tl li.done .q{text-decoration:line-through;color:var(--muted)}
.tl .q{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.tl .nm{font-weight:700;font-size:17px;line-height:1.25}
.tl .md{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.flag{background:var(--clay-soft);color:var(--clay)}
.tag.note{background:var(--sun-soft);color:var(--sun-ink)}
.ticket footer{padding:10px 12px 12px;display:flex;gap:8px}
.ticket footer .btn{flex:1}
.ticket.listo{opacity:.92}
.ticket.listo header{background:var(--ok-soft)}
.sechead{display:flex;align-items:baseline;gap:10px}
.sechead h3{margin:0;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sechead span{font-weight:800}

/* ================= CIERRE ================= */
.rep{height:100%;overflow-y:auto;padding-block:16px 60px;padding-inline:16px}
.rep-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.reptop{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.reptop h2{margin:0;font-family:var(--f-display);font-size:36px;line-height:1;flex:1;min-width:200px}
.reptop input[type=date]{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.kpi .s{color:var(--muted);font-size:12.5px;margin-top:2px}
.kpi.hero{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.kpi.hero .label{color:#a9d6ec}
.kpi.hero .s{color:#b7c5ca}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3 small{font-weight:500;color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.recon td input{max-width:140px;text-align:right;min-height:36px;padding:6px 10px}
.diff{font-weight:800}
.diff.okc{color:var(--ok)} .diff.bad{color:var(--crit)}
.barcell{display:flex;align-items:center;gap:8px}
.barcell .b{height:8px;border-radius:4px;background:var(--accent);min-width:2px}
.milks{display:flex;flex-wrap:wrap;gap:8px}
.milks .m{background:var(--surface-2);padding:8px 12px;border-radius:10px;font-weight:700}
.milks .m b{font-size:18px;margin-right:4px}
.chart svg{width:100%;height:auto;display:block}
.chart .bx{fill:var(--accent)}
.chart .bx.pk{fill:var(--sun)}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .vl{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.demo{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px;padding:12px 16px;border:1px dashed var(--line);border-radius:var(--r)}
.demo span{flex:1;min-width:220px}
.olist td .items{color:var(--muted);font-size:13px;max-width:360px}
.olist tr.void td{opacity:.5}
.olist tr.void td .items{text-decoration:line-through}

.mnu{height:100%;overflow-y:auto;padding-block:16px 100px;padding-inline:16px}
.mnu-in{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.mrow{display:grid;grid-template-columns:minmax(160px,2fr) 120px 160px minmax(200px,2.4fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .opts{display:flex;flex-wrap:wrap;gap:4px}
.mrow .opts label{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--surface-2);cursor:pointer;display:inline-flex;gap:5px;align-items:center;color:var(--muted)}
.mrow .opts label:has(input:checked){background:var(--accent-soft);color:var(--accent-ink)}
.mrow .opts input{margin:0;accent-color:var(--accent)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--ok)}
.confirm{font-size:11px;font-weight:800;color:var(--warn);display:block;margin-top:3px}
.savebar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);flex-wrap:wrap}

.mhead{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.mhead h2{margin:0;font-family:var(--f-display);font-size:36px;line-height:1;flex:1}

/* toast */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;align-items:center;pointer-events:none;width:calc(100% - 32px)}
.toast{background:var(--board);color:var(--board-ink);padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:tin .2s ease-out;max-width:520px;text-align:center}
.toast b{color:#f0cf5a}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

/* ---------- responsive ---------- */
@media (max-width:980px){

  .mrow>:nth-child(1){grid-area:n}.mrow>:nth-child(2){grid-area:p}.mrow>:nth-child(3){grid-area:c}.mrow>:nth-child(4){grid-area:o}.mrow>:nth-child(5){grid-area:a}.mrow>:nth-child(6){grid-area:d;justify-self:end}

(function(){

/* ---------------- helpers ---------------- */
const $ = (s, r) => (r || document).querySelector(s);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clp = n => '$' + Math.round(n || 0).toLocaleString('es-CL');
const z2 = n => String(n).padStart(2, '0');
const dayKey = (d) => { d = d || new Date(); return d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate()); };
const hhmm = ms => { const d = new Date(ms); return z2(d.getHours()) + ':' + z2(d.getMinutes()); };
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const dayLabel = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('es-CL', {weekday:'long', day:'numeric', month:'long'}); };

/* ---------------- menu ---------------- */
const OPT = {

const DEFAULT_MENU = {

    {id:'medialuna', name:'Medialuna Premium', cat:'dulce', price:2500, opts:[]},

    {id:'croissant', name:'Croissant jamón-queso', cat:'salado', price:3300, opts:[], confirm:true}
  ]
};
const ICONS = {
  cafe:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h17v7a7 7 0 0 1-7 7h-3a7 7 0 0 1-7-7z"/><path d="M23 14h2a3 3 0 0 1 0 6h-2"/><path d="M11 4c-1 2 1 3 0 5M16 4c-1 2 1 3 0 5"/></svg>',
  esp:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11h18l-2 15H9z"/><path d="M16 5c4 0 6 3 6 6"/><path d="M12 17c2 2 6 2 8 0"/></svg>',
  frio:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10h16l-2 17H10z"/><path d="M18 10l3-7h3"/><circle cx="14" cy="18" r="1.5"/><circle cx="18" cy="21" r="1.5"/></svg>',
  prot:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 9h12v17a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2z"/><path d="M11 9V5h10v4"/><path d="M10 15h12"/></svg>',
  dulce:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 25h22V15L5 20z"/><path d="M5 20v5M27 15l-9-6-13 11"/><circle cx="18" cy="6" r="2"/></svg>',
  salado:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21c2-8 7-12 12-12s10 4 12 12c-4 2-8 3-12 3s-8-1-12-3z"/><path d="M12 11l2 11M20 11l-2 11"/></svg>'
};
function normalizeMenu(m){
  const out = clone(DEFAULT_MENU);
  if (!m || typeof m !== 'object') return out;
  if (Array.isArray(m.categories) && m.categories.length) out.categories = m.categories.filter(c => c && c.id).map(c => ({id:String(c.id), name:String(c.name || c.id)}));
  if (Array.isArray(m.products)) out.products = m.products.filter(p => p && p.id).map(p => ({id:String(p.id), name:String(p.name || ''), cat:String(p.cat || out.categories[0].id), price:Math.max(0, Number(p.price) || 0), opts:Array.isArray(p.opts) ? p.opts.filter(k => OPT[k]) : [], confirm:!!p.confirm, off:!!p.off}));
  if (Number(m.pagers) > 0) out.pagers = Math.min(60, Math.round(Number(m.pagers)));
  return out;
}

/* ---------------- state ---------------- */
const S = {
  view:'caja', today:dayKey(), reportDay:dayKey(),
  menu:clone(DEFAULT_MENU), menuDraft:null, menuDirty:false,
  byDay:{}, closings:{},
  cart:[], meta:{pager:null, autoPager:true, pay:'mp', name:'', togo:true},
  cat:'todo', q:'', mode:'connecting', sound:false, cartOpen:false,
  seen:null, fresh:new Set()
};
const ordersOf = day => Object.values(S.byDay[day] || {});
const activeOrders = () => ordersOf(S.today).filter(o => o.status === 'nuevo' || o.status === 'preparando' || o.status === 'listo').sort((a, b) => a.createdAt - b.createdAt);
const usedPagers = () => { const m = {}; activeOrders().forEach(o => { if (o.pager) m[o.pager] = o; }); return m; };
const product = id => S.menu.products.find(p => p.id === id);
const nextNumber = () => ordersOf(S.today).reduce((mx, o) => Math.max(mx, o.n || 0), 0) + 1;

/* ---------------- storage: cloud (Neon vía /api) or this device ---------------- */
const LS_KEY = 'galacafe.v1';
const local = {orders:{}, menu:null, closings:{}};
let bc = null;
const API = 'api/';
const POLL_MS = 1500;
const Store = {days:new Set(), cursor:0, revs:{}, pending:{}, chains:{}, timer:null, polling:false, fails:0};

function lsRead(){ try { const v = JSON.parse(localStorage.getItem(LS_KEY)); if (v && typeof v === 'object') { local.orders = v.orders || {}; local.menu = v.menu || null; local.closings = v.closings || {}; return true; } } catch (e) {} return false; }
function lsWrite(){ try { localStorage.setItem(LS_KEY, JSON.stringify(local)); } catch (e) {} try { bc && bc.postMessage('sync'); } catch (e) {} }
function localToState(){
  S.menu = normalizeMenu(local.menu);
  const by = {};
  Object.values(local.orders).forEach(o => { (by[o.day] = by[o.day] || {})[o.id] = o; });
  S.byDay = by; S.closings = clone(local.closings);
}
function startLocal(seedDemo){
  S.mode = 'local';
  const had = lsRead();
  if (!had && seedDemo) { demoOrders(S.today, S.menu, Date.now()).forEach(o => { local.orders[o.id] = o; }); lsWrite(); }
  localToState();
  try { bc = new BroadcastChannel('galacafe'); bc.onmessage = () => { lsRead(); localToState(); ordersChanged(); renderAll(); }; } catch (e) {}
  window.addEventListener('storage', e => { if (e.key === LS_KEY) { lsRead(); localToState(); ordersChanged(); renderAll(); } });
  setSync();
  ordersChanged(true); renderAll();
}

async function apiSync(since, days){
  const r = await fetch(API + 'sync?since=' + since + '&days=' + days.join(','), {cache:'no-store'});
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || !Array.isArray(j.docs)) throw Object.assign(new Error((j && j.error) || 'HTTP ' + r.status), {code:'unavailable'});
  return j;
}
async function apiWrite(body){
  let r;
  try { r = await fetch(API + 'write', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)}); }
  catch (e) { throw Object.assign(new Error('sin conexión'), {code:'unavailable'}); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'HTTP ' + r.status), {code:r.status >= 500 || r.status === 429 ? 'unavailable' : (j.code || 'rejected')});
  return j;
}
async function startCloud(){
  if (!/^https?:$/.test(location.protocol)) return false;
  let j;
  try { j = await apiSync(0, [S.today]); } catch (e) { return false; }
  if (S.mode === 'local') return false;
  S.mode = 'cloud'; Store.days.add(S.today); Store.cursor = j.rev;
  applyDocs(j, [S.today]); setSync(); ordersChanged(true);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });
  window.addEventListener('online', () => poll());
  Store.timer = setTimeout(poll, POLL_MS);
  return true;
}
async function poll(){
  if (S.mode !== 'cloud' || Store.polling) return;
  clearTimeout(Store.timer); Store.polling = true;
  try {
    applyDocs(await apiSync(Store.cursor, [...Store.days]));
    if (Store.fails) { Store.fails = 0; setSync(); }
  } catch (e) {
    if (++Store.fails === 3) { setSync(); toast('Conexión inestable, reintentando…'); }
  }
  Store.polling = false;
  const wait = document.visibilityState === 'hidden' ? 5000 : Store.fails ? Math.min(10000, POLL_MS * (1 + Store.fails)) : POLL_MS;
  Store.timer = setTimeout(poll, wait);
}
// Aplica documentos del servidor. fullDays = esos días vienen completos (reemplazan lo que hay).
// Los documentos con escrituras propias en curso se ignoran: el siguiente sondeo los trae ya confirmados.
function applyDocs(j, fullDays){
  let orders = false, menu = false;
  const touched = new Set(fullDays || []);
  (fullDays || []).forEach(d => {
    const keep = {}; Object.values(S.byDay[d] || {}).forEach(o => { if (Store.pending['orders/' + o.id]) keep[o.id] = o; });
    S.byDay[d] = keep; orders = true;
  });
  j.docs.forEach(d => {
    if (Store.pending[d.path] || (!fullDays && Store.revs[d.path] === d.rev)) return;
    Store.revs[d.path] = d.rev;
    if (d.coll === 'config') {
      if (d.path === 'config/menu' && !d.deleted) { S.menu = normalizeMenu(d.data); if (S.view === 'menu' && !S.menuDirty) S.menuDraft = null; menu = true; }
    } else if (d.coll === 'orders') {
      const id = d.path.slice(7), cur = Object.assign({}, S.byDay[d.day]);
      if (d.deleted) delete cur[id]; else cur[id] = d.data;
      S.byDay[d.day] = cur; orders = true; touched.add(d.day);
    } else if (d.coll === 'closings' && !closingTimers[d.day]) {
      S.closings[d.day] = d.deleted ? {} : clone(d.data);
      if (S.view === 'cierre' && d.day === S.reportDay && !(document.activeElement && document.activeElement.closest('.recon'))) renderCierre();
    }
  });
  if (!fullDays) Store.cursor = Math.max(Store.cursor, Number(j.rev) || 0);
  if (orders && touched.has(S.today)) ordersChanged();
  if (orders || menu) renderAll();
}
function watchDay(day){
  if (S.mode !== 'cloud' || Store.days.has(day)) return;
  Store.days.add(day);
  apiSync(0, [day]).then(j => applyDocs(j, [day])).catch(() => { Store.days.delete(day); toast('No se pudo cargar ese día. Revisa la conexión.'); });
}
function unwatchDay(day){ if (day !== S.today) Store.days.delete(day); }
function queue(path, fn){
  Store.pending[path] = (Store.pending[path] || 0) + 1;
  const attempt = n => fn().catch(e => {
    if (e && e.code === 'unavailable' && n < 6) return new Promise(r => setTimeout(r, Math.min(8000, 500 * 2 ** n))).then(() => attempt(n + 1));
    throw e;
  });
  const prev = Store.chains[path] || Promise.resolve();
  const p = prev.then(() => attempt(0)).catch(e => {
    if (e && e.code === 'unavailable') toast('No se pudo guardar. Revisa la conexión.');
    else toast('No se pudo guardar: ' + ((e && e.message) || 'error'));
  }).finally(() => { if (!--Store.pending[path]) delete Store.pending[path]; });
  Store.chains[path] = p; return p;
}
function deepMerge(t, s){ Object.keys(s).forEach(k => { const v = s[k]; if (v && typeof v === 'object' && !Array.isArray(v) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) deepMerge(t[k], v); else t[k] = v; }); return t; }

function putOrder(o){

let actx = null;
function chime(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    [880, 1318].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * 0.16); g.gain.exponentialRampToValueAtTime(0.25, t + i * 0.16 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.16 + 0.35);
      o.connect(g); g.connect(actx.destination); o.start(t + i * 0.16); o.stop(t + i * 0.16 + 0.4);
    });
  } catch (e) {}
}

function lineKey(pid, mods, note){ return pid + '|' + JSON.stringify(mods) + '|' + (note || ''); }

    const g = OPT[k], v = mods[k]; if (!g || v == null) return;

function advance(o, to){
  const now = Date.now(), patch = {status:to};
  if (to === 'preparando' && !o.startedAt) patch.startedAt = now;
  if (to === 'listo') { patch.readyAt = now; if (!o.startedAt) patch.startedAt = now; const d = {}; o.items.forEach((_, i) => d[i] = true); patch.done = d; }

  patchOrder(o, patch);
  if (to === 'listo') toast(o.pager ? `Llama al beeper <b>${o.pager}</b> · pedido #${o.n} listo` : `Pedido <b>#${o.n}</b> listo${o.name ? ' · ' + esc(o.name) : ''}`);
  renderAll();
}

/* ================= BARRA ================= */
function ageClass(m){ return m < 5 ? 'ok' : m < 10 ? 'warn' : 'crit'; }
function renderBarra(){
  const act = activeOrders();
  const queue = act.filter(o => o.status !== 'listo');
  const ready = act.filter(o => o.status === 'listo');
  const agg = {};
  queue.forEach(o => o.items.forEach((l, i) => {
    if (o.done && o.done[i]) return;
    const fl = modsList(l.mods).filter(m => m.flag).map(m => m.t);
    const k = l.name + (fl.length ? ' · ' + fl.join(', ') : '');
    agg[k] = (agg[k] || 0) + l.qty;
  }));
  const ak = Object.keys(agg).sort((a, b) => agg[b] - agg[a]);

function stats(day){
  const all = ordersOf(day).sort((a, b) => a.createdAt - b.createdAt);
  const valid = all.filter(o => o.status !== 'anulado');
  const s = {all, valid, total:0, count:valid.length, units:0, pay:{mp:0, efectivo:0, transferencia:0}, payN:{mp:0, efectivo:0, transferencia:0}, prods:{}, milk:{}, hours:{}, prep:[], voided:all.length - valid.length};
  valid.forEach(o => {
    s.total += o.total; s.pay[o.pay] = (s.pay[o.pay] || 0) + o.total; s.payN[o.pay] = (s.payN[o.pay] || 0) + 1;
    const h = new Date(o.createdAt).getHours(); s.hours[h] = (s.hours[h] || 0) + o.total;
    if (o.readyAt) s.prep.push((o.readyAt - o.createdAt) / 60000);
    o.items.forEach(l => {
      s.units += l.qty;
      const p = s.prods[l.name] = s.prods[l.name] || {q:0, t:0}; p.q += l.qty; p.t += l.qty * l.price;
      if (l.mods && l.mods.milk) s.milk[l.mods.milk] = (s.milk[l.mods.milk] || 0) + l.qty;
    });
  });
  s.avg = s.count ? s.total / s.count : 0;
  s.prepAvg = s.prep.length ? s.prep.reduce((a, b) => a + b, 0) / s.prep.length : 0;
  return s;
}
function hourChart(s){
  const hs = Object.keys(s.hours).map(Number);
  if (!hs.length) return `<div class="empty" style="padding:24px"><p>Sin ventas registradas este día.</p></div>`;
  const h0 = Math.min(8, ...hs), h1 = Math.max(20, ...hs);
  const n = h1 - h0 + 1, W = 640, H = 220, pl = 8, pr = 8, pt = 22, pb = 26;
  const mx = Math.max(...Object.values(s.hours));
  const top = Math.ceil(mx / 10000) * 10000 || 10000;
  const bw = (W - pl - pr) / n;
  let g = '';
  [0.5, 1].forEach(f => { const y = pt + (H - pt - pb) * (1 - f); g += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text class="ax" x="${W - pr}" y="${y - 4}" text-anchor="end">${clp(top * f)}</text>`; });
  for (let i = 0; i < n; i++) {
    const h = h0 + i, v = s.hours[h] || 0, bh = (H - pt - pb) * v / top, x = pl + i * bw + bw * 0.16, y = H - pb - bh;
    if (v) g += `<rect class="bx ${v === mx ? 'pk' : ''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.68).toFixed(1)}" height="${Math.max(1, bh).toFixed(1)}" rx="3"><title>${z2(h)}:00 · ${clp(v)}</title></rect>`;
    if (v === mx) g += `<text class="vl" x="${(x + bw * 0.34).toFixed(1)}" y="${(y - 6).toFixed(1)}" text-anchor="middle">${clp(v)}</text>`;
    if (i % 2 === 0 || n <= 13) g += `<text class="ax" x="${(pl + i * bw + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${h}h</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por hora">${g}</svg>`;
}

function pickDay(d){

function summaryText(day){
  const s = stats(day), top = Object.entries(s.prods).sort((a, b) => b[1].q - a[1].q).slice(0, 6);
  const c = S.closings[day] || {};
  const rec = (k, lbl) => `${lbl}: ${clp(s.pay[k])}` + (c[k] !== '' && c[k] != null ? ` (reportado ${clp(c[k])}${Number(c[k]) - s.pay[k] ? ', dif. ' + clp(Number(c[k]) - s.pay[k]) : ', cuadra'})` : '');
  return [
    `Gala Café Cochoa · Cierre ${day.split('-').reverse().join('-')}`,
    `Ventas: ${clp(s.total)} · ${s.count} pedidos · ticket prom. ${clp(s.avg)}`,
    rec('mp', 'Mercado Pago'), rec('efectivo', 'Efectivo'), rec('transferencia', 'Transferencia'),
    `Más vendidos: ${top.map(([n, v]) => v.q + ' ' + n).join(', ') || '—'}`,
    s.prep.length ? `Tiempo prom. en barra: ${s.prepAvg.toFixed(1)} min` : ''
  ].filter(Boolean).join('\n');
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); toast('Resumen copiado. Pégalo en WhatsApp o correo.'); }
  catch (e) { openModal(`<header><h3>Resumen del día</h3><button class="xbtn" data-m="x">×</button></header><div class="body"><textarea id="sumtx" style="width:100%;min-height:200px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)">${esc(t)}</textarea><p style="margin:0;color:var(--muted);font-size:13px">Selecciona el texto y cópialo.</p></div>`); $('#sheet').onclick = ev => { if (ev.target.closest('[data-m]')) closeModal(); }; const ta = $('#sumtx'); ta.focus(); ta.select(); }
}
function csvFor(day){
  const q = v => { const s = String(v == null ? '' : v); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [['pedido','fecha','hora','beeper','cliente','producto','cantidad','opciones','nota','precio_unitario','subtotal','medio_pago','estado','minutos_barra']];
  ordersOf(day).sort((a, b) => a.createdAt - b.createdAt).forEach(o => o.items.forEach(l => {
    rows.push([o.n, day, hhmm(o.createdAt), o.pager || '', o.name || '', l.name, l.qty, modsList(l.mods).map(m => m.t).join(' / '), l.note || '', l.price, l.price * l.qty, PAY_LABEL[o.pay] || o.pay, o.status, o.readyAt ? ((o.readyAt - o.createdAt) / 60000).toFixed(1) : '']);
  }));
  return '﻿' + rows.map(r => r.map(q).join(';')).join('\n');
}
async function downloadCsv(day){
  const data = csvFor(day);
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (dl) {
    try { await dl.save({filename:`gala-cafe-ventas-${day}.csv`, data}); toast('Archivo CSV listo'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  copyText(data.replace(/^﻿/, ''));
}

    </div>`;
}
function menuDirty(){ S.menuDirty = true; const bar = $('.savebar'); if (bar) { bar.querySelector('span').textContent = 'Tienes cambios sin guardar. La caja sigue usando el menú anterior hasta que guardes.'; bar.querySelector('[data-mm="save"]').disabled = false; bar.querySelector('[data-mm="discard"]').disabled = false; } }
$('#mnuIn').addEventListener('input', e => {
  const t = e.target, m = S.menuDraft; if (!m) return;
  if (t.id === 'mpagers') { m.pagers = Math.max(1, Math.min(60, Number(t.value) || 1)); return menuDirty(); }
  const row = t.closest('.mrow'); if (!row) return;
  const p = m.products.find(x => x.id === row.dataset.pid); if (!p) return;
  if (t.dataset.f === 'name') p.name = t.value;
  else if (t.dataset.f === 'price') { p.price = Math.max(0, Number(t.value) || 0); p.confirm = false; }
  else return;
  menuDirty();
});
$('#mnuIn').addEventListener('change', e => {
  const t = e.target, m = S.menuDraft; if (!m) return;
  const row = t.closest('.mrow'); if (!row) return;
  const p = m.products.find(x => x.id === row.dataset.pid); if (!p) return;
  if (t.dataset.f === 'cat') { p.cat = t.value; menuDirty(); renderMenu(); }
  else if (t.dataset.f === 'on') { p.off = !t.checked; menuDirty(); }
  else if (t.dataset.opt) { const k = t.dataset.opt; p.opts = t.checked ? Object.keys(OPT).filter(x => x === k || p.opts.includes(x)) : p.opts.filter(x => x !== k); menuDirty(); }
});
$('#mnuIn').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const m = S.menuDraft;
  if (b.dataset.add) { m.products.push({id:'p' + uid(), name:'Nuevo producto', cat:b.dataset.add, price:0, opts:[], confirm:true}); S.menuDirty = true; renderMenu(); const rows = $$('.mrow input[data-f="name"]'); const last = rows.filter(i => i.closest('.mrow').dataset.pid === m.products[m.products.length - 1].id)[0]; if (last) { last.focus(); last.select(); } }
  else if (b.dataset.del) { const p = m.products.find(x => x.id === b.dataset.del); confirmBox(`¿Eliminar ${p.name}?`, 'Deja de aparecer en la caja. Los pedidos ya registrados no cambian. Si es temporal, mejor desmarca “A la venta”.', 'Eliminar producto', () => { m.products = m.products.filter(x => x.id !== b.dataset.del); S.menuDirty = true; renderMenu(); }); }
  else if (b.dataset.mm === 'save') { saveMenu(m); S.menuDraft = null; S.menuDirty = false; renderMenu(); toast('Menú guardado. La caja ya muestra los nuevos precios.'); }
  else if (b.dataset.mm === 'discard') { S.menuDraft = null; S.menuDirty = false; renderMenu(); }
  else if (b.dataset.mm === 'reset') confirmBox('¿Restaurar el menú de la pizarra?', 'Vuelve a los productos y precios originales de Gala Café. Debes guardar para aplicarlo.', 'Restaurar', () => { S.menuDraft = clone(DEFAULT_MENU); S.menuDirty = true; renderMenu(); });
});

/* ---------------- demo day ---------------- */
/*DEMO-START*/
function demoOrders(day, menu, nowMs, existing){
  existing = existing || [];
  let seed = 0; for (const ch of day) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const [y, mo, d] = day.split('-').map(Number);
  const start = new Date(y, mo - 1, d, 8, 40).getTime();
  const isToday = (() => { const t = new Date(nowMs); return t.getFullYear() === y && t.getMonth() === mo - 1 && t.getDate() === d; })();
  const end = isToday ? Math.min(nowMs - 60000, new Date(y, mo - 1, d, 20, 30).getTime()) : new Date(y, mo - 1, d, 20, 0).getTime();
  const weights = {cortado:14, latte:11, capuccino:10, americano:9, espresso:5, flatwhite:5, mokaccino:4, caramel:4, vainilla:4, chocolate:4, matcha:5, icedmatcha:5, chai:3, jugo:5, smoothie:5, batido:5, caluga:6, medialuna:8, queque:4, barrita:3, cuchufli:3, croissant:4};
  const prods = menu.products.filter(p => !p.off);
  const bag = []; prods.forEach(p => { for (let i = 0; i < (weights[p.id] || 2); i++) bag.push(p); });
  const milks = ['Entera','Entera','Entera','Entera','Entera','Descremada','Sin lactosa','Sin lactosa','Avena','Avena','Almendras','NotMilk','Soya'];
  const names = ['Camila','Diego','Fran','Tomás','Javi','Coni','Matías','Sofi','Benja','Isi','Nico','Vale','Pancho','Trini','Rodrigo','Maite','','','','',''];
  const pays = ['mp','mp','mp','mp','mp','mp','mp','efectivo','efectivo','transferencia'];
  const out = [];
  let n = existing.reduce((mx, o) => Math.max(mx, o.n || 0), 0);
  let t = start;
  const times = [];
  while (t < end) {
    const h = new Date(t).getHours();
    const busy = (h >= 10 && h < 13) || (h >= 16 && h < 19);
    t += (busy ? 3 : 7) * 60000 + rnd() * (busy ? 6 : 12) * 60000;
    if (t < end) times.push(t);
  }
  if (isToday && times.length >= 3) { times[times.length - 1] = nowMs - 2 * 60000; times[times.length - 2] = nowMs - 6 * 60000; times[times.length - 3] = nowMs - 11 * 60000; }
  const used = new Set();
  times.forEach((ct, idx) => {
    n++;
    const nItems = rnd() < 0.55 ? 1 : rnd() < 0.75 ? 2 : 3;
    const items = [];
    for (let i = 0; i < nItems; i++) {
      const p = pick(bag);
      const mods = {};
      p.opts.forEach(k => {
        if (k === 'milk') mods.milk = pick(milks);
        else if (k === 'temp') mods.temp = rnd() < 0.85 ? 'Normal' : pick(['Tibio','Extra caliente']);
        else if (k === 'protein') mods.protein = rnd() < 0.7 ? 'Whey' : 'Vegana';
        else if (k === 'pbase') mods.pbase = pick(['Agua','Leche entera','Avena','Almendras','Sin lactosa']);
        else if (k === 'extras') mods.extras = rnd() < 0.4 ? ['Creatina'] : [];
      });
      const note = p.opts.includes('milk') && rnd() < 0.08 ? pick(['Sin azúcar','Con canela','Sin espuma']) : '';
      const ex = items.find(l => l.pid === p.id && JSON.stringify(l.mods) === JSON.stringify(mods) && l.note === note);
      if (ex) ex.qty++; else items.push({pid:p.id, name:p.name, cat:p.cat, price:p.price, qty:1, mods, note});
    }
    const total = items.reduce((a, l) => a + l.price * l.qty, 0);
    const remaining = times.length - idx;
    let status = 'entregado';
    if (isToday && remaining <= 3) status = remaining === 1 ? 'nuevo' : remaining === 2 ? 'preparando' : 'listo';
    let pager = null;
    if (rnd() < 0.92) { let p = 1 + Math.floor(rnd() * Math.min(20, menu.pagers || 20)); while (status !== 'entregado' && used.has(p)) p = p % (menu.pagers || 20) + 1; if (status !== 'entregado') used.add(p); pager = p; }
    const prep = (3 + rnd() * 6 + items.length) * 60000;
    const o = {id: day + '-demo' + String(n).padStart(3, '0'), day, n, pager, name: pick(names), togo: rnd() < 0.8, pay: pick(pays), total, items, done:{}, status, createdAt: Math.round(ct), demo:true};
    if (status === 'preparando') { o.startedAt = o.createdAt + 120000; o.done = {0:true}; }
    if (status === 'listo' || status === 'entregado') { o.startedAt = o.createdAt + 60000; o.readyAt = Math.round(ct + prep); const dn = {}; items.forEach((_, i) => dn[i] = true); o.done = dn; }
    if (status === 'entregado') o.deliveredAt = o.readyAt + Math.round(60000 + rnd() * 180000);
    if (!isToday || status === 'entregado') { if (rnd() < 0.02) o.status = 'anulado'; }
    out.push(o);
  });
  return out;
}
/*DEMO-END*/

/* ---------------- clock & day rollover ---------------- */
function tick(){
  const d = new Date();
  $('#clock').textContent = z2(d.getHours()) + ':' + z2(d.getMinutes());
  const k = dayKey(d);
  if (k !== S.today) {
    const old = S.today; S.today = k;
    if (S.mode === 'cloud') { if (S.reportDay !== old) unwatchDay(old); watchDay(k); }
    if (S.reportDay === old) S.reportDay = k;
    S.seen = null; ordersChanged(true);
  }
  if (S.view === 'barra') renderBarra();
}
setInterval(tick, 20000);

/* ---------------- boot ---------------- */
(function boot(){
  tick();
  const h = location.hash.slice(1);
  setView(['caja','barra','cierre','menu'].includes(h) ? h : 'caja', true);
  document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && S.sound && !wakeLock) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} } });
  const timeout = new Promise(r => setTimeout(() => r(false), 6000));
  Promise.race([startCloud(), timeout]).then(ok => { if (!ok && S.mode !== 'cloud') startLocal(true); else renderAll(); });
})();
})();
